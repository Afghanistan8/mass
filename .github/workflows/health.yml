name: deployment-health
on:
  schedule: [{ cron: "17 */6 * * *" }]
  workflow_dispatch: {}
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Live Studionet reads, wiring and exact deployed-source byte match
        run: npm run health:check
        env:
          MASS_HEALTH_BASE_URL: ${{ vars.MASS_HEALTH_BASE_URL }}
          EXPECTED_FRONTEND_COMMIT: ${{ vars.EXPECTED_FRONTEND_COMMIT }}
